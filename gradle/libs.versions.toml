[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
androidxCore = "1.19.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxRecyclerView = "1.4.0"
coroutines = "1.11.0"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
junit = "6.1.3"

[libraries]
androidxFragment = { module = "androidx.fragment:fragment-ktx", version = "1.9.1" }
androidxNavigation = { module = "androidx.navigation:navigation-fragment-ktx", version = "2.10.2" }
androidxNavigationTesting = { module = "androidx.navigation:navigation-testing", version = "2.10.2" }

androidxLifecycleSavedState = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "androidxLifecycle" }
dataStore = { module = "androidx.datastore:datastore-preferences", version = "1.2.1" }
# Upgrades AGP's built-in Kotlin dependency without applying kotlin-android.
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
androidxCore = { module = "androidx.core:core", version.ref = "androidxCore" }
androidxActivity = { module = "androidx.activity:activity", version.ref = "androidxActivity" }
androidxActivityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidxLifecycleViewModel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidxLifecycleRuntime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidxLifecycle" }
androidxLifecycleRuntimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidxRecyclerView = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerView" }
coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
# The Compose BOM supplies versions for these libraries; it excludes the compiler.
composeUi = { module = "androidx.compose.ui:ui" }
composeFoundation = { module = "androidx.compose.foundation:foundation" }
composeMaterial3 = { module = "androidx.compose.material3:material3" }
composeToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
composeTooling = { module = "androidx.compose.ui:ui-tooling" }
composeTestManifest = { module = "androidx.compose.ui:ui-test-manifest" }
composeTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidxTestJunit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidxTestRunner = { module = "androidx.test:runner", version.ref = "androidxTest" }
espressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
